<app-search-bar (titleChange)="onSearch($event)"></app-search-bar>

<div class="container">
  @for (movie of movieService.movieList(); track movie.id) {
    <div class="movie-card" (click)="navigateTo(movie)">
      <div>
        <img [src]="`https://image.tmdb.org/t/p/w500${movie.poster_path}`" [alt]="movie.title">
      </div>
      <div class="movie-detail">
        <h2>{{ movie.title }}</h2>
      </div>
    </div>
  }
</div>
